<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Stardew Gundam</title>
<style>
/* ===========================================
   1. 基础重置 + 字体
   =========================================== */
@font-face {
  font-family: 'Zpix';
  src: url('https://cdn.jsdelivr.net/npm/zpix@3.1.4/dist/Zpix.woff2') format('woff2');
  font-display: swap;
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

html, body {
  width: 100vw; height: 100vh;
  overflow: hidden;
  font-family: 'Zpix', 'Microsoft YaHei', monospace;
  background: #2d1b0e;
  cursor: url('assets/cursor_stardew.png') 2 2, auto;
  user-select: none;
  -webkit-user-select: none;
}

/* ===========================================
   2. CSS 变量
   =========================================== */
:root {
  --brown-dark: #2d1b0e;
  --brown-mid: #5c3a1e;
  --border-gold: #e8c170;
  --highlight: #ffd700;
  --text-warm: #f5e6d3;
  --text-dark: #3e2710;
  --red-alert: #c04040;
  --slot-empty: rgba(255,255,255,0.12);
  --slot-filled: rgba(255,215,0,0.45);
  --overlay-bg: rgba(0,0,0,0.55);
  --z-bg: 0;
  --z-npc: 10;
  --z-indicator: 20;
  --z-inventory: 50;
  --z-item: 100;
  --z-popup: 200;
  --z-bubble: 300;
  --z-panel: 400;
  --z-transition: 500;
  --z-loading: 600;
}

/* ===========================================
   3. 加载画面
   =========================================== */
#loading-screen {
  position: fixed; inset: 0; z-index: var(--z-loading);
  background: var(--brown-dark);
  display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  transition: opacity 0.5s;
}
#loading-screen.fade-out { opacity: 0; pointer-events: none; }
#loading-screen .load-text {
  color: var(--border-gold); font-size: 20px;
  animation: breathe 2s ease-in-out infinite;
}
#loading-screen .load-sub {
  color: var(--text-warm); font-size: 13px; margin-top: 12px; opacity: 0.7;
}

/* ===========================================
   4. Stage 通用样式
   =========================================== */
.stage {
  position: fixed; inset: 0; z-index: var(--z-bg);
  opacity: 0; pointer-events: none;
  transition: opacity 0.6s ease;
}
.stage.active { opacity: 1; pointer-events: auto; }
.stage-bg {
  position: absolute; inset: 0;
  background-size: cover; background-position: center;
  background-color: var(--brown-dark);
}

/* ===========================================
   5. Stage 1 — 办公室
   =========================================== */
.alert-popup {
  position: absolute; width: 380px;
  background: var(--brown-mid);
  border: 4px solid var(--border-gold);
  box-shadow: 0 0 0 4px var(--brown-dark), 0 8px 24px rgba(0,0,0,0.6);
  padding: 0; z-index: var(--z-popup);
  animation: scalePop 0.3s ease-out;
}
.alert-popup .popup-title {
  background: var(--border-gold); color: var(--text-dark);
  font-size: 14px; padding: 6px 10px;
  display: flex; justify-content: space-between; align-items: center;
}
.alert-popup .popup-close {
  width: 24px; height: 24px; background: var(--red-alert);
  border: 2px solid #801010; color: #fff;
  font-size: 14px; line-height: 20px; text-align: center;
  cursor: url('assets/cursor_stardew.png') 2 2, pointer;
}
.alert-popup .popup-close:hover { background: #e05050; }
.alert-popup .popup-body {
  padding: 16px 14px; color: var(--text-warm); font-size: 14px; line-height: 1.6;
}
.alert-popup.shrinking { animation: scaleShrink 0.3s ease-in forwards; }

/* 嫩芽气泡 */
#sprout-bubble {
  position: absolute; left: 50%; top: 42%; transform: translate(-50%, -50%);
  z-index: var(--z-bubble);
  width: 80px; height: 80px;
  border-radius: 50%;
  background: radial-gradient(circle at 40% 35%, #8fcc5a, #3d7a1c);
  border: 3px solid #2d5a10;
  box-shadow: 0 0 24px rgba(140,200,80,0.5), 0 0 60px rgba(140,200,80,0.25);
  cursor: url('assets/cursor_stardew.png') 2 2, pointer;
  animation: breathe 2s ease-in-out infinite;
  display: flex; align-items: center; justify-content: center;
}
#sprout-bubble::after {
  content: '✦'; color: #fff; font-size: 28px;
  text-shadow: 0 0 8px rgba(255,255,255,0.8);
}
#sprout-bubble.hidden { display: none; }

/* ===========================================
   6. Stage 2 — 四季
   =========================================== */
.npc-char {
  position: absolute; bottom: 75px;
  height: 15vh; min-height: 100px; max-height: 150px;
  width: auto; object-fit: contain;
  z-index: var(--z-npc);
  cursor: url('assets/cursor_stardew.png') 2 2, pointer;
  transition: left 0.4s ease;
}
.item-hotspot {
  position: absolute; max-height: 9vh;
  object-fit: contain; z-index: var(--z-item);
  cursor: url('assets/cursor_stardew.png') 2 2, pointer;
  filter: drop-shadow(0 0 6px rgba(255,255,255,0.5));
  transition: transform 0.15s, filter 0.15s, left 0.3s, top 0.3s;
}
.item-hotspot:hover { filter: drop-shadow(0 0 14px var(--highlight)); transform: scale(1.1); }
.item-hotspot.collected { display: none; }
.item-hotspot.shake { animation: shake 0.4s ease; }

#season-indicator {
  position: absolute; bottom: 80px; left: 50%; transform: translateX(-50%);
  z-index: var(--z-indicator);
  color: var(--text-warm); font-size: 18px;
  background: rgba(0,0,0,0.5);
  padding: 4px 20px; border-radius: 4px;
  pointer-events: none;
  transition: opacity 0.4s;
}
#season-indicator .arrow { color: var(--border-gold); margin: 0 6px; }

/* ===========================================
   7. Stage 3 — 终章
   =========================================== */
#final-npc {
  position: absolute; left: 50%; top: 38%; transform: translate(-50%, -50%);
  height: 12vh; min-height: 80px; max-height: 120px;
  width: auto; object-fit: contain;
  z-index: var(--z-npc);
  cursor: url('assets/cursor_stardew.png') 2 2, pointer;
  transition: filter 0.3s;
}
#final-npc.glow-hint {
  animation: pulseGlow 2s ease-in-out infinite;
}

/* "再点我一下？" 气泡 */
#ending-hint-bubble {
  position: absolute; left: 50%; top: 18%; transform: translateX(-50%);
  z-index: var(--z-bubble);
  background: rgba(0,0,0,0.75); color: var(--border-gold);
  font-size: 14px; padding: 8px 16px;
  border: 2px solid var(--border-gold);
  border-radius: 6px;
  animation: breathe 3s ease-in-out infinite;
}
#ending-hint-bubble::after {
  content: ''; position: absolute; bottom: -10px; left: 50%; transform: translateX(-50%);
  border: 6px solid transparent; border-top: 6px solid var(--border-gold);
}
#ending-hint-bubble.hidden { display: none; }

/* ===========================================
   8. 物品栏
   =========================================== */
#inventory-bar {
  position: fixed; bottom: 0; left: 50%; transform: translateX(-50%);
  z-index: var(--z-inventory);
  display: flex; gap: 8px; padding: 10px 20px;
  background: rgba(0,0,0,0.6);
  border-top: 3px solid var(--border-gold);
  border-left: 3px solid var(--border-gold);
  border-right: 3px solid var(--border-gold);
  border-radius: 8px 8px 0 0;
  transition: opacity 0.4s;
}
#inventory-bar.hidden { opacity: 0; pointer-events: none; }
.inv-slot {
  width: 52px; height: 52px;
  border: 2px dashed var(--slot-empty);
  border-radius: 4px;
  display: flex; align-items: center; justify-content: center;
  transition: border 0.3s, box-shadow 0.3s, background 0.3s;
}
.inv-slot img { max-width: 80%; max-height: 80%; object-fit: contain; }
.inv-slot.filled {
  border: 2px solid var(--border-gold);
  background: var(--slot-filled);
  box-shadow: 0 0 10px rgba(255,215,0,0.4);
}

/* ===========================================
   9. 对话框
   =========================================== */
#dialog-overlay {
  position: fixed; inset: 0; z-index: var(--z-panel);
  display: flex; align-items: flex-end; justify-content: center;
  padding-bottom: 100px;
  pointer-events: none; opacity: 0;
  transition: opacity 0.25s;
}
#dialog-overlay.visible { opacity: 1; pointer-events: auto; }
#dialog-box {
  width: 72vw; min-height: 100px;
  background: var(--brown-mid);
  border: 5px solid var(--border-gold);
  box-shadow: 0 0 0 3px var(--brown-dark), 0 10px 30px rgba(0,0,0,0.7);
  padding: 22px 24px; position: relative;
  animation: slideUp 0.4s ease-out;
  cursor: url('assets/cursor_stardew.png') 2 2, pointer;
}
#dialog-box::after {
  content: '▼'; position: absolute; bottom: 6px; right: 14px;
  color: var(--border-gold); font-size: 12px;
  animation: breathe 1.5s ease-in-out infinite;
}
#dialog-text { color: var(--text-warm); font-size: 16px; line-height: 1.8; min-height: 28px; }
#dialog-text .typing-cursor::after {
  content: '▌'; color: var(--highlight); animation: typewriterBlink 0.6s step-end infinite;
}

/* ===========================================
   10. 信件面板
   =========================================== */
#letter-overlay {
  position: fixed; inset: 0; z-index: calc(var(--z-panel) + 10);
  display: flex; align-items: center; justify-content: center;
  background: var(--overlay-bg);
  opacity: 0; pointer-events: none;
  transition: opacity 0.4s;
}
#letter-overlay.visible { opacity: 1; pointer-events: auto; }
#letter-panel {
  width: 620px; max-height: 78vh; overflow-y: auto;
  background: #f5e6c8;
  border: 6px solid #c8a050;
  box-shadow: 0 0 0 3px #6b3a1e, 0 14px 40px rgba(0,0,0,0.6);
  padding: 40px 36px;
  color: #3e2710; font-size: 15px; line-height: 2.2;
  position: relative;
}
#letter-panel p { margin-bottom: 14px; }
#letter-close-btn {
  display: block; margin: 24px auto 0;
  background: var(--brown-mid); color: var(--text-warm);
  border: 3px solid var(--border-gold);
  font-family: inherit; font-size: 14px;
  padding: 8px 28px;
  cursor: url('assets/cursor_stardew.png') 2 2, pointer;
}
#letter-close-btn:hover { background: #7a4e28; }
#letter-panel .letter-signature {
  text-align: right; margin-top: 20px; color: #8b6914; font-size: 14px;
}

/* ===========================================
   11. 社交面板
   =========================================== */
#social-overlay {
  position: fixed; inset: 0; z-index: calc(var(--z-panel) + 10);
  display: flex; align-items: center; justify-content: center;
  background: var(--overlay-bg);
  opacity: 0; pointer-events: none;
  transition: opacity 0.4s;
}
#social-overlay.visible { opacity: 1; pointer-events: auto; }
#social-panel {
  width: 440px; background: var(--brown-mid);
  border: 5px solid var(--border-gold);
  box-shadow: 0 0 0 3px var(--brown-dark), 0 14px 40px rgba(0,0,0,0.6);
  padding: 28px 30px;
  color: var(--text-warm);
}
#social-panel h3 {
  text-align: center; font-size: 22px; color: var(--highlight);
  margin-bottom: 6px;
}
#social-panel .social-subtitle { text-align: center; font-size: 13px; opacity: 0.7; margin-bottom: 24px; }
.achievement-list { margin-bottom: 20px; }
.achievement-row {
  display: flex; align-items: center; gap: 10px;
  padding: 10px 14px; margin-bottom: 6px;
  background: rgba(0,0,0,0.25);
  border: 2px solid rgba(232,193,112,0.25);
  border-radius: 4px;
  animation: achieveReveal 0.5s ease-out forwards;
  opacity: 0;
}
.achievement-row:nth-child(1) { animation-delay: 0.1s; }
.achievement-row:nth-child(2) { animation-delay: 0.25s; }
.achievement-row:nth-child(3) { animation-delay: 0.4s; }
.achievement-row:nth-child(4) { animation-delay: 0.55s; }
.achievement-row .season-tag {
  font-size: 18px; flex-shrink: 0; width: 28px; text-align: center;
}
.achievement-row .season-label {
  font-size: 12px; opacity: 0.6; flex-shrink: 0; width: 56px;
}
.achievement-row .achievement-title {
  font-size: 14px; color: var(--highlight);
}
.social-links { display: flex; gap: 16px; justify-content: center; margin-top: 22px; }
.social-links a {
  display: inline-block; padding: 8px 18px;
  background: var(--brown-dark); color: var(--border-gold);
  border: 2px solid var(--border-gold);
  font-size: 13px; text-decoration: none;
  cursor: url('assets/cursor_stardew.png') 2 2, pointer;
  transition: background 0.2s, transform 0.2s;
}
.social-links a:hover { background: #4a2a10; transform: translateY(-2px); }
#social-close-btn {
  display: block; margin: 20px auto 0;
  background: transparent; color: var(--text-warm);
  border: 2px solid var(--border-gold);
  font-family: inherit; font-size: 13px;
  padding: 6px 24px;
  cursor: url('assets/cursor_stardew.png') 2 2, pointer;
}
#social-close-btn:hover { background: rgba(255,255,255,0.08); }

/* ===========================================
   12. 转场遮罩
   =========================================== */
#transition-overlay {
  position: fixed; inset: 0; z-index: var(--z-transition);
  pointer-events: none; opacity: 0;
}
#transition-overlay.white-flash {
  background: #fff; animation: whiteFlash 0.9s ease-out forwards;
}
#transition-overlay.black-fade {
  background: #000; animation: blackFade 1.6s ease-out forwards;
}

/* ===========================================
   13. 存档询问弹窗
   =========================================== */
#save-prompt {
  position: fixed; inset: 0; z-index: calc(var(--z-loading) - 10);
  display: flex; align-items: center; justify-content: center;
  background: var(--overlay-bg);
  opacity: 0; pointer-events: none;
  transition: opacity 0.3s;
}
#save-prompt.visible { opacity: 1; pointer-events: auto; }
#save-prompt .prompt-box {
  background: var(--brown-mid); border: 5px solid var(--border-gold);
  box-shadow: 0 0 0 3px var(--brown-dark), 0 12px 36px rgba(0,0,0,0.6);
  padding: 30px 34px; text-align: center; max-width: 440px;
}
#save-prompt .prompt-box p { color: var(--text-warm); font-size: 15px; line-height: 1.8; margin-bottom: 20px; }
#save-prompt .prompt-btns { display: flex; gap: 14px; justify-content: center; }
#save-prompt .prompt-btns button {
  font-family: inherit; font-size: 14px; padding: 8px 24px;
  border: 3px solid var(--border-gold);
  cursor: url('assets/cursor_stardew.png') 2 2, pointer;
  transition: background 0.2s;
}
#save-prompt .btn-continue { background: var(--brown-mid); color: var(--highlight); }
#save-prompt .btn-continue:hover { background: #7a4e28; }
#save-prompt .btn-restart { background: transparent; color: var(--text-warm); }
#save-prompt .btn-restart:hover { background: rgba(255,255,255,0.06); }

/* ===========================================
   14. 飞行道具（Stage 3 用）
   =========================================== */
.flying-item {
  position: fixed; z-index: 450; pointer-events: none;
  transition: none;
}

/* ===========================================
   15. 动画关键帧
   =========================================== */
@keyframes breathe {
  0%, 100% { transform: scale(1); }
  50% { transform: scale(1.08); }
}
@keyframes scalePop {
  from { transform: scale(0); opacity: 0; }
  to { transform: scale(1); opacity: 1; }
}
@keyframes scaleShrink {
  from { transform: scale(1); opacity: 1; }
  to { transform: scale(0); opacity: 0; }
}
@keyframes slideUp {
  from { transform: translateY(30px); opacity: 0; }
  to { transform: translateY(0); opacity: 1; }
}
@keyframes typewriterBlink {
  0%, 100% { opacity: 1; }
  50% { opacity: 0; }
}
@keyframes whiteFlash {
  0% { opacity: 0; }
  30% { opacity: 1; }
  100% { opacity: 0; }
}
@keyframes blackFade {
  0% { opacity: 0; }
  30% { opacity: 1; }
  100% { opacity: 1; }
}
@keyframes pulseGlow {
  0%, 100% { filter: drop-shadow(0 0 4px rgba(255,215,0,0.3)); }
  50% { filter: drop-shadow(0 0 18px rgba(255,215,0,0.8)); }
}
@keyframes shake {
  0%, 100% { transform: translateX(0); }
  20% { transform: translateX(-8px); }
  40% { transform: translateX(8px); }
  60% { transform: translateX(-5px); }
  80% { transform: translateX(5px); }
}
@keyframes achieveReveal {
  from { opacity: 0; transform: translateX(-20px); }
  to { opacity: 1; transform: translateX(0); }
}
</style>
</head>
<body>

<!-- 加载画面 -->
<div id="loading-screen">
  <div class="load-text">Loading...</div>
  <div class="load-sub">星露谷正在加载</div>
</div>

<!-- Stage 1: 办公室 -->
<section id="stage-office" class="stage active">
  <div class="stage-bg" style="background-image:url('assets/bg_office.png')"></div>
  <div id="popup-container"></div>

</section>

<!-- Stage 2: 四季 -->
<section id="stage-seasons" class="stage">

<!-- 社交面板 -->
<div id="social-overlay">
  <div id="social-panel">
    <h3>王高达</h3>
    <div class="social-subtitle">鹈鹕镇荣誉居民</div>

<script>
/* ===========================================
   Stardew Gundam — Global State Manager
   =========================================== */
const SAVE_KEY = 'stardew_gundam_save';
const SEASONS = ['spring', 'summer', 'autumn', 'winter'];
const SEASON_NAMES = { spring: '春', summer: '夏', autumn: '秋', winter: '冬' };

const State = {
  currentStage: 'office',
  currentSeason: 'spring',
  inventory: [false, false, false, false],
  dialogueDone: { spring: false, summer: false, autumn: false, winter: false },
  autumnClickCount: 0,
  popupsClosed: 0,
  letterDelivered: false,
  letterRead: false,
  isTyping: false // lock for typewriter
};

/* ===========================================
   Constants — 对话 & 信件
   =========================================== */

/* ===========================================
   Utility Functions
   =========================================== */
const $ = (sel) => document.querySelector(sel);
const $$ = (sel) => document.querySelectorAll(sel);

function rand(min, max) { return Math.floor(Math.random() * (max - min + 1)) + min; }

/* ===========================================
   Save / Load
   =========================================== */
function saveGame() {
  try {
    const data = {
      currentStage: State.currentStage,
      currentSeason: State.currentSeason,
      inventory: State.inventory,
      dialogueDone: State.dialogueDone,
      autumnClickCount: State.autumnClickCount,
      popupsClosed: State.popupsClosed,
      letterDelivered: State.letterDelivered,
      letterRead: State.letterRead
    };
    localStorage.setItem(SAVE_KEY, JSON.stringify(data));
  } catch (e) { /* quota exceeded or privacy mode, silently fail */ }
}

function loadGame() {
  try {
    const raw = localStorage.getItem(SAVE_KEY);
    if (!raw) return false;
    const data = JSON.parse(raw);
    Object.assign(State, data);
    return true;
  } catch (e) { return false; }
}

function clearSave() {
  try { localStorage.removeItem(SAVE_KEY); } catch (e) { /* ignore */ }
}

/* ===========================================
   Loading & Initialization
   =========================================== */
function hideLoading() {
  loadingScreen.classList.add('fade-out');
  setTimeout(() => { loadingScreen.style.display = 'none'; }, 600);
}

window.addEventListener('load', () => {
  setTimeout(hideLoading, 800);
  const hasSave = loadGame();
  if (hasSave) {
    State.hasSave = true;
    showSavePrompt();
  } else {
    initOffice();
  }
});

/* ===========================================
   Save Prompt
   =========================================== */
let savePromptTimeout = null;

function showSavePrompt() {
  savePrompt.classList.add('visible');
  savePromptTimeout = setTimeout(() => {
    closeSavePrompt(true);
  }, 10000);
}

function closeSavePrompt(doContinue) {
  clearTimeout(savePromptTimeout);
  savePrompt.classList.remove('visible');
  if (doContinue) {
    if (State.currentStage === 'ending') {
      restoreEndingState();
    } else if (State.currentStage === 'seasons') {
      restoreSeasonsState();
    } else {
      restoreOfficeState();
    }
  } else {
    clearSave();
    State.inventory = [false, false, false, false];
    State.dialogueDone = { spring: false, summer: false, autumn: false, winter: false };
    State.autumnClickCount = 0;
    State.popupsClosed = 0;
    State.letterDelivered = false;
    State.letterRead = false;
    State.currentStage = 'office';
    State.currentSeason = 'spring';
    initOffice();
  }
}

$('#btn-continue').addEventListener('click', () => closeSavePrompt(true));
$('#btn-restart').addEventListener('click', () => closeSavePrompt(false));

function restoreOfficeState() {
  switchStageEl('office');
  inventoryBar.classList.add('hidden');
  popupContainer.innerHTML = '';
  sproutBubble.classList.add('hidden');
  if (State.popupsClosed >= 3) {
    sproutBubble.classList.remove('hidden');
  } else {
    // re-create already-closed popups as invisible placeholders for count
    for (let i = 0; i < State.popupsClosed; i++) {
      // these were already closed, skip spawning them
    }
    spawnRemainingPopups();
  }
}

function restoreSeasonsState() {
  switchStageEl('seasons');
  inventoryBar.classList.remove('hidden');
  renderSeason(State.currentSeason);
  renderInventory();
  if (checkAllCollected()) {
    triggerEndingTransition();
  }
}

function restoreEndingState() {
  switchStageEl('ending');
  inventoryBar.classList.remove('hidden');
  renderInventory();
  finalNpc.classList.remove('glow-hint');
  endingHint.classList.add('hidden');
  if (!State.letterDelivered) {
    setTimeout(deliverItems, 600);
  } else if (!State.letterRead) {
    showEndingHint();
  } else {
    showEndingHint();
  }
}

/* ===========================================
   Stage Switching
   =========================================== */
function switchStageEl(target) {
  [stageOffice, stageSeasons, stageEnding].forEach(s => s.classList.remove('active'));
  if (target === 'office') stageOffice.classList.add('active');
  else if (target === 'seasons') stageSeasons.classList.add('active');
  else if (target === 'ending') stageEnding.classList.add('active');
  State.currentStage = target;
}

function transitionEffect(type, callback) {
  const ov = transitionOverlay;
  ov.classList.remove('white-flash', 'black-fade');
  void ov.offsetWidth; // force reflow
  if (type === 'white') {
    ov.classList.add('white-flash');
    setTimeout(() => { ov.classList.remove('white-flash'); if (callback) callback(); }, 900);
  } else if (type === 'black') {
    ov.classList.add('black-fade');
    setTimeout(() => { if (callback) callback(); }, 1600);
  }
}

   Stage 1 — 办公室

const POPUP_MESSAGES = [
  { title: '🔴 紧急Bug', body: '生产环境崩溃，立刻回滚！' },
  { title: '📋 老板的需求', body: '这个需求很简单，下班前给个方案。' },
  { title: '📅 会议邀请', body: '下午6:00 对齐颗粒度，已重复：每天。' }
];

function initOffice() {
  switchStageEl('office');
  inventoryBar.classList.add('hidden');
  sproutBubble.classList.add('hidden');
  State.popupsClosed = 0;
  popupContainer.innerHTML = '';
  spawnRemainingPopups();
}

function spawnRemainingPopups() {
  const start = State.popupsClosed;
  for (let i = start; i < 3; i++) {
    setTimeout(() => spawnPopup(i), (i - start) * 800 + 400);
  }
}

function spawnPopup(index) {
  const popup = document.createElement('div');
  popup.className = 'alert-popup';
  const left = rand(8, 52);
  const top = rand(8, 40);
  popup.style.left = left + '%';
  popup.style.top = top + '%';
  popup.innerHTML = `
    <div class="popup-title">
      <span>${POPUP_MESSAGES[index].title}</span>
      <button class="popup-close">✕</button>
    </div>
    <div class="popup-body">${POPUP_MESSAGES[index].body}</div>
  `;
  popup.querySelector('.popup-close').addEventListener('click', (e) => {
    e.stopPropagation();
    closePopup(popup);
  });
  popupContainer.appendChild(popup);
}

function closePopup(popup) {
  popup.classList.add('shrinking');
  popup.addEventListener('animationend', () => {
    popup.remove();
    State.popupsClosed++;
    saveGame();
    if (State.popupsClosed >= 3) {
      showBubble();
    }
  }, { once: true });
}

function showBubble() {
  sproutBubble.classList.remove('hidden');
  sproutBubble.style.animation = 'none';
  void sproutBubble.offsetWidth;
  sproutBubble.style.animation = 'breathe 2s ease-in-out infinite';
}

sproutBubble.addEventListener('click', () => {
  sproutBubble.classList.add('hidden');
  transitionEffect('white', () => {
    initSeasons();
  });
});

/* ===========================================
   Stage 2 — 四季循环
   =========================================== */
let wheelTimeout = null;
let pendingSeasonDelta = null;

function initSeasons() {
  switchStageEl('seasons');
  inventoryBar.classList.remove('hidden');
  State.currentSeason = 'spring';
  State.autumnClickCount = 0;
  renderSeason(State.currentSeason);
  renderInventory();
  saveGame();
}

function renderSeason(season) {
  const cfg = SEASON_CONFIG[season];
  seasonBg.style.backgroundImage = `url('${cfg.bg}')`;
  seasonNpc.src = cfg.npc;
  seasonNpc.style.cssText = '';
  Object.entries(cfg.npcStyle).forEach(([k, v]) => { seasonNpc.style[k] = v; });
  seasonNpc.style.transition = 'opacity 0.35s ease, left 0.4s ease';

  const itemIndex = SEASONS.indexOf(season);
  if (State.inventory[itemIndex]) {
    seasonItem.classList.add('collected');
  } else {
    seasonItem.classList.remove('collected');
    seasonItem.src = cfg.item;
    seasonItem.style.cssText = '';
    Object.entries(cfg.itemStyle).forEach(([k, v]) => { seasonItem.style[k] = v; });
    seasonItem.style.transition = 'opacity 0.35s ease, left 0.3s, top 0.3s, filter 0.15s, transform 0.15s';
  }

  State.currentSeason = season;
  State.autumnClickCount = 0;
  renderInventory();
}

function renderInventory() {
  const slots = $$('.inv-slot');
  slots.forEach((slot, i) => {
    slot.innerHTML = '';
    if (State.inventory[i]) {
      slot.classList.add('filled');
      const img = document.createElement('img');
      img.src = ITEM_SRCS[i];
      img.alt = '已收集';
      slot.appendChild(img);
    } else {
      slot.classList.remove('filled');
    }
  });
}

function onWheel(e) {
  if (State.currentStage !== 'seasons') return;
  if (State.isTyping || dialogOverlay.classList.contains('visible')) return;
  const delta = e.deltaY > 0 ? 1 : -1;
  if (wheelTimeout) {
    pendingSeasonDelta = delta;
    return;
  }
  applySeasonChange(delta);
  wheelTimeout = setTimeout(() => {
    wheelTimeout = null;
    if (pendingSeasonDelta !== null) {
      applySeasonChange(pendingSeasonDelta);
      pendingSeasonDelta = null;
    }
  }, 800);
}

function applySeasonChange(delta) {
  const idx = SEASONS.indexOf(State.currentSeason);
  const newIdx = (idx + delta + 4) % 4;
  const oldSeason = State.currentSeason;
  const newSeason = SEASONS[newIdx];

  // crossfade
  seasonBg.style.opacity = '0';
  seasonNpc.style.opacity = '0';
  seasonItem.style.opacity = '0';
  seasonIndicator.style.opacity = '0';

  setTimeout(() => {
    renderSeason(newSeason);
    seasonBg.style.opacity = '1';
    seasonNpc.style.opacity = '1';
    seasonItem.style.opacity = '1';
    seasonIndicator.style.opacity = '1';
    State.currentSeason = newSeason;
    State.autumnClickCount = 0;
    saveGame();
  }, 350);
}

// Transition timings for season elements
seasonBg.style.transition = 'opacity 0.35s ease';
seasonNpc.style.transition = 'opacity 0.35s ease, left 0.4s ease';
seasonItem.style.transition = 'opacity 0.35s ease, left 0.3s, top 0.3s, filter 0.15s, transform 0.15s';
seasonIndicator.style.transition = 'opacity 0.35s';

/* ===========================================
   NPC Click (Stage 2)
   =========================================== */
seasonNpc.addEventListener('click', () => {
  if (State.currentStage !== 'seasons') return;
  if (State.isTyping) return;
  const season = State.currentSeason;
  if (State.dialogueDone[season]) {
    showDialog(NPC_GREETINGS[season], null);
  } else {
    showDialog(NPC_DIALOGUES[season], () => {
      State.dialogueDone[season] = true;
      saveGame();
    });
  }
});

/* ===========================================
   Item Click (Stage 2) — 含秋季捉迷藏
   =========================================== */
seasonItem.addEventListener('click', (e) => {
  e.stopPropagation();
  if (State.currentStage !== 'seasons') return;
  if (State.isTyping) return;
  const itemIndex = SEASONS.indexOf(State.currentSeason);
  if (State.inventory[itemIndex]) return;

  if (State.currentSeason === 'autumn') {
    if (State.autumnClickCount === 0) {
      // shake + teleport
      seasonItem.classList.add('shake');
      seasonItem.addEventListener('animationend', function h() {
        seasonItem.classList.remove('shake');
        seasonItem.removeEventListener('animationend', h);
      }, { once: true });
      teleportAutumnItem();
      State.autumnClickCount = 1;
      return;
    }
    // second click => collect
  }

  collectItem(itemIndex);
});

function teleportAutumnItem() {
  let left, top;
  const npcRect = seasonNpc.getBoundingClientRect();
  const npcCX = npcRect.left + npcRect.width / 2;
  const npcCY = npcRect.top + npcRect.height / 2;
  // keep trying until 200px away from NPC center
  for (let i = 0; i < 20; i++) {
    left = rand(8, 72);
    top = rand(12, 58);
    const elX = (left / 100) * window.innerWidth;
    const elY = (top / 100) * window.innerHeight;
    const dist = Math.sqrt((elX - npcCX) ** 2 + (elY - npcCY) ** 2);
    if (dist > 200) break;
  }
  seasonItem.style.left = left + '%';
  seasonItem.style.top = top + '%';
}

function collectItem(itemIndex) {
  const slotEl = $$('.inv-slot')[itemIndex];
  const itemRect = seasonItem.getBoundingClientRect();
  const slotRect = slotEl.getBoundingClientRect();

  // clone flies to inventory
  const clone = seasonItem.cloneNode(true);
  clone.style.position = 'fixed';
  clone.style.left = itemRect.left + 'px';
  clone.style.top = itemRect.top + 'px';
  clone.style.width = itemRect.width + 'px';
  clone.style.height = itemRect.height + 'px';
  clone.style.zIndex = '450';
  clone.style.pointerEvents = 'none';
  clone.style.margin = '0';
  clone.style.maxHeight = 'none';
  document.body.appendChild(clone);

  clone.animate([
    { left: itemRect.left + 'px', top: itemRect.top + 'px', opacity: 1, transform: 'scale(1)' },
    { left: (slotRect.left + slotRect.width/2 - itemRect.width/2) + 'px', top: (slotRect.top + slotRect.height/2 - itemRect.height/2) + 'px', opacity: 0.5, transform: 'scale(0.3)' }
  ], { duration: 500, easing: 'ease-in', fill: 'forwards' }).onfinish = () => clone.remove();

  seasonItem.classList.add('collected');
  State.inventory[itemIndex] = true;
  renderInventory();
  saveGame();

  if (checkAllCollected()) {
    setTimeout(triggerEndingTransition, 800);
  }
}

function checkAllCollected() {
  return State.inventory.every(Boolean);
}

function triggerEndingTransition() {
  transitionOverlay.classList.add('black-fade');
  setTimeout(() => {
    transitionOverlay.classList.remove('black-fade');
    switchStageEl('ending');
    inventoryBar.classList.remove('hidden');
    renderInventory();
    setTimeout(deliverItems, 500);
  }, 1600);
}

/* ===========================================
   Stage 3 — 终章
   =========================================== */
function deliverItems() {
  if (State.letterDelivered) return;
  const npcRect = finalNpc.getBoundingClientRect();
  const targetX = npcRect.left + npcRect.width / 2;
  const targetY = npcRect.top + npcRect.height * 0.3;
  const invSlots = $$('.inv-slot');

  let completed = 0;
  State.inventory.forEach((has, i) => {
    if (!has) return;
    const slotRect = invSlots[i].getBoundingClientRect();
    const img = document.createElement('img');
    img.src = ITEM_SRCS[i];
    img.className = 'flying-item';
    img.style.left = (slotRect.left + slotRect.width / 2 - 20) + 'px';
    img.style.top = (slotRect.top + slotRect.height / 2 - 20) + 'px';
    img.style.width = '40px';
    document.body.appendChild(img);

    img.animate([
      { left: img.style.left, top: img.style.top, opacity: 1 },
      { left: (targetX - 20) + 'px', top: (targetY - 20) + 'px', opacity: 0 }
    ], { duration: 700, delay: i * 300, easing: 'ease-in', fill: 'forwards' }).onfinish = () => {
      img.remove();
      completed++;
      if (completed === State.inventory.filter(Boolean).length) {
        setTimeout(() => {
          showDialog('谢谢你帮我找回了这些记忆。作为回报，我送你一封信吧。', () => {
            State.letterDelivered = true;
            saveGame();
            // close dialog first, then show letter
            dialogOverlay.classList.remove('visible');
            dialogText.textContent = '';
            currentDialogFullText = '';
            setTimeout(showLetter, 600);
          });
        }, 300);
      }
    };
  });
}

function showLetter() {
  const idx = Math.floor(Math.random() * LETTERS.length);
  letterContent.innerHTML = `<p>${LETTERS[idx]}</p><div class="letter-signature">—— 爷爷</div>`;
  letterOverlay.classList.add('visible');
}

$('#letter-close-btn').addEventListener('click', () => {
  letterOverlay.classList.remove('visible');
  State.letterRead = true;
  saveGame();
  setTimeout(showEndingHint, 500);
});

function showEndingHint() {
  finalNpc.classList.add('glow-hint');
  endingHint.classList.remove('hidden');
}

/* ===========================================
   Stage 3 — NPC Click (final-npc)
   =========================================== */
finalNpc.addEventListener('click', () => {
  if (State.currentStage !== 'ending') return;
  if (!State.letterRead) return;
  showSocialPanel();
});

function showSocialPanel() {
  socialOverlay.classList.add('visible');
  finalNpc.classList.remove('glow-hint');
  endingHint.classList.add('hidden');
  clearSave();
}

$('#social-close-btn').addEventListener('click', () => {
  socialOverlay.classList.remove('visible');
});

/* ===========================================
   Dialog System (Typewriter)
   =========================================== */
let typewriterTimer = null;
let currentDialogFullText = '';
let currentDialogCallback = null;

function showDialog(text, onComplete) {
  if (State.isTyping) return;
  State.isTyping = true;
  currentDialogFullText = text;
  currentDialogCallback = onComplete || null;
  dialogOverlay.classList.add('visible');
  dialogText.textContent = '';
  dialogText.classList.add('typing-cursor');

  let i = 0;
  const speed = 45;

  function type() {
    if (i < text.length) {
      dialogText.textContent += text.charAt(i);
      i++;
      typewriterTimer = setTimeout(type, speed);
    } else {
      finishTypewriter();
    }
  }
  type();
}

function finishTypewriter() {
  dialogText.classList.remove('typing-cursor');
  State.isTyping = false;
  const cb = currentDialogCallback;
  currentDialogCallback = null;
  if (cb) cb();
}

function skipOrCloseDialog() {
  if (State.isTyping) {
    clearTimeout(typewriterTimer);
    dialogText.textContent = currentDialogFullText;
    finishTypewriter();
  } else {
    dialogOverlay.classList.remove('visible');
    dialogText.textContent = '';
    currentDialogFullText = '';
  }
}

dialogOverlay.addEventListener('click', (e) => {
  if (e.target === dialogOverlay || e.target.closest('#dialog-box')) {
    skipOrCloseDialog();
  }
});

/* ===========================================
   Global Events
   =========================================== */
window.addEventListener('wheel', onWheel, { passive: false });

// Click on stage ending (non-NPC area) to close social panel
stageEnding.addEventListener('click', (e) => {
  if (e.target === stageEnding || e.target.classList.contains('stage-bg')) {
    if (socialOverlay.classList.contains('visible')) {
      socialOverlay.classList.remove('visible');
    }
  }
});

// Prevent default scroll behavior
document.addEventListener('wheel', (e) => { e.preventDefault(); }, { passive: false });
document.addEventListener('keydown', (e) => {
  if (e.key === 'ArrowDown' || e.key === 'ArrowUp' || e.key === 'PageDown' || e.key === 'PageUp') {
    e.preventDefault();
  }
}, { passive: false });

/* ===========================================
   Image Error Fallback
   =========================================== */
document.querySelectorAll('img').forEach(img => {
  img.addEventListener('error', () => {
    img.style.background = '#2d1b0e';
    img.style.minWidth = '40px';
    img.style.minHeight = '40px';
  });
});

// Background image fallback handled by CSS background-color on .stage-bg
</script>
